name: Notices crawler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Notion을 변경하지 않고 실행 결과만 확인
        required: true
        type: boolean
        default: true
      schema_migration:
        description: Notion 스키마를 갱신하고 종료
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notices-crawler
  cancel-in-progress: false

jobs:
  sync:
    name: Crawl and sync
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TZ: Asia/Seoul
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"
      INTERNAL_DEADLINE_SECONDS: "1200"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            requirements.lock

      - name: Restore crawler state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/public-run-state.json
          key: crawler-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crawler-state-

      - name: Validate restored crawler state
        if: ${{ hashFiles('.runtime/public-run-state.json') != '' }}
        run: python .github/scripts/cache_state.py .runtime/public-run-state.json .runtime/run-state.json

      - name: Validate manual options
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SCHEMA_MIGRATION: ${{ inputs.schema_migration }}
        run: |
          if [[ "$DRY_RUN" == "true" && "$SCHEMA_MIGRATION" == "true" ]]; then
            echo "::error::드라이런과 스키마 갱신을 동시에 선택할 수 없습니다."
            exit 1
          fi

      - name: Verify dependency lock
        run: python .github/scripts/verify_lock.py requirements.lock requirements.txt requirements-constraints.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        run: python main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          NOTION_SCHEMA_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_migration && '1' || '0' }}
          NOTION_SCHEMA_MIGRATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_migration && '1' || '0' }}

      - name: Prepare public crawler state
        if: ${{ always() && hashFiles('.runtime/run-state.json') != '' }}
        run: python .github/scripts/cache_state.py .runtime/run-state.json .runtime/public-run-state.json

      - name: Save crawler state
        if: ${{ always() && hashFiles('.runtime/run-state.json') != '' && hashFiles('.runtime/public-run-state.json') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/public-run-state.json
          key: crawler-state-${{ github.run_id }}-${{ github.run_attempt }}
