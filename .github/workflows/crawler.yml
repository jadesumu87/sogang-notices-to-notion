name: Notices crawler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Notion을 변경하지 않고 실행 결과만 확인
        required: true
        type: boolean
        default: true
      schema_migration:
        description: Notion 스키마를 갱신하고 종료
        required: true
        type: boolean
        default: false
      existing_pages_migration:
        description: 기존 공지 페이지의 이관 계획을 생성하거나 적용
        required: true
        type: boolean
        default: false
      existing_pages_confirmation:
        description: 계획 실행 로그의 전체 확인 문자열
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: notices-crawler
  cancel-in-progress: false

jobs:
  sync:
    name: Crawl and sync
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"
      INTERNAL_DEADLINE_SECONDS: "2700"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            requirements.lock

      - name: Restore crawler state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/public-run-state.json
          key: crawler-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crawler-state-

      - name: Validate restored crawler state
        if: ${{ hashFiles('.runtime/public-run-state.json') != '' }}
        run: python .github/scripts/cache_state.py .runtime/public-run-state.json .runtime/run-state.json

      - name: Validate manual options
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SCHEMA_MIGRATION: ${{ inputs.schema_migration }}
          EXISTING_PAGES_MIGRATION: ${{ inputs.existing_pages_migration }}
          EXISTING_PAGES_CONFIRMATION: ${{ inputs.existing_pages_confirmation }}
        run: |
          if [[ "$DRY_RUN" == "true" && "$SCHEMA_MIGRATION" == "true" ]]; then
            echo "::error::드라이런과 스키마 갱신을 동시에 선택할 수 없습니다."
            exit 1
          fi
          if [[ "$SCHEMA_MIGRATION" == "true" && "$EXISTING_PAGES_MIGRATION" == "true" ]]; then
            echo "::error::스키마 갱신과 기존 페이지 이관을 동시에 실행할 수 없습니다."
            exit 1
          fi
          if [[ "$EXISTING_PAGES_MIGRATION" != "true" && -n "$EXISTING_PAGES_CONFIRMATION" ]]; then
            echo "::error::기존 페이지 이관을 선택하지 않은 실행에는 확인 문자열을 사용할 수 없습니다."
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" && -n "$EXISTING_PAGES_CONFIRMATION" ]]; then
            echo "::error::기존 페이지 이관 적용에는 드라이런을 해제해야 합니다."
            exit 1
          fi

      - name: Verify dependency lock
        run: python .github/scripts/verify_lock.py requirements.lock requirements.txt requirements-constraints.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Install Playwright browser
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.schema_migration && !inputs.existing_pages_migration) }}
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.existing_pages_migration }}
        run: python main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          INTERNAL_DEADLINE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.schema_migration && '6300' || env.INTERNAL_DEADLINE_SECONDS }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          NOTION_SCHEMA_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_migration && '1' || '0' }}
          NOTION_SCHEMA_MIGRATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_migration && '1' || '0' }}

      - name: Run existing page migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_pages_migration }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          MIGRATION_CONFIRMATION: ${{ inputs.existing_pages_confirmation }}
        run: |
          mkdir -p .runtime
          python scripts/migrate_existing_pages.py \
            --all-pages \
            --output .runtime/existing-pages-migration.json
          if [[ -n "$MIGRATION_CONFIRMATION" ]]; then
            python scripts/migrate_existing_pages.py \
              --apply \
              --plan .runtime/existing-pages-migration.json \
              --confirm "$MIGRATION_CONFIRMATION"
          fi

      - name: Prepare public crawler state
        if: ${{ always() && hashFiles('.runtime/run-state.json') != '' }}
        run: python .github/scripts/cache_state.py .runtime/run-state.json .runtime/public-run-state.json

      - name: Save crawler state
        if: ${{ always() && hashFiles('.runtime/run-state.json') != '' && hashFiles('.runtime/public-run-state.json') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/public-run-state.json
          key: crawler-state-${{ github.run_id }}-${{ github.run_attempt }}
