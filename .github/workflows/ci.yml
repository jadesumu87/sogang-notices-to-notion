name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            requirements.lock
            requirements-ci.txt
            requirements-ci-constraints.txt
            requirements-ci.lock

      - name: Wait before retrying Python setup
        if: ${{ steps.setup-python.outcome == 'failure' }}
        run: sleep 60

      - name: Retry Python setup
        id: setup-python-retry
        if: ${{ steps.setup-python.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            requirements.lock
            requirements-ci.txt
            requirements-ci-constraints.txt
            requirements-ci.lock

      - name: Wait before final Python setup
        if: ${{ steps.setup-python-retry.outcome == 'failure' }}
        run: sleep 180

      - name: Final Python setup
        if: ${{ steps.setup-python-retry.outcome == 'failure' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            requirements.lock
            requirements-ci.txt
            requirements-ci-constraints.txt
            requirements-ci.lock

      - name: Verify dependency locks
        run: |
          python .github/scripts/verify_lock.py requirements.lock requirements.txt requirements-constraints.txt
          python .github/scripts/verify_lock.py requirements-ci.lock requirements-ci.txt requirements-ci-constraints.txt

      - name: Verify pinned actions
        run: python .github/scripts/verify_actions.py .github/workflows

      - name: Validate workflow syntax
        run: |
          install -d "${RUNNER_TEMP}/actionlint"
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "${RUNNER_TEMP}/actionlint/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint/actionlint.tar.gz" -C "${RUNNER_TEMP}/actionlint" actionlint
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -exec "${RUNNER_TEMP}/actionlint/actionlint" -pyflakes= {} +

      - name: Audit locked dependencies
        run: python .github/scripts/audit_lock_vulnerabilities.py requirements.lock requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-ci.lock

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Install Playwright browser
        run: python .github/scripts/install_playwright_browser.py

      - name: Validate Python syntax
        run: python -m compileall -q main.py scripts .github/scripts

      - name: Run lint checks
        run: ruff check .

      - name: Run type checks
        run: |
          python -m mypy --strict main.py
          MYPYPATH=scripts python -m mypy --strict scripts .github/scripts

      - name: Run tests
        env:
          CRAWLER_ACTIONS_ANNOTATIONS: "0"
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --fail-under=60

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate
