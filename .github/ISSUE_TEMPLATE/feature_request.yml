name: 개선 제안
description: 기능이나 사용성을 개선할 아이디어를 알려 주세요.
title: "[제안] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경
      description: 어떤 문제나 불편을 해결하려는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있다면 적어 주세요.
    validations:
      required: false
